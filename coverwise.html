<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CoverWise</title>
<style>
:root{--bg:#f5f7fc;--c:#fff;--t:#0f1b3d;--m:#5b6785;--b:#dfe5f1;--p:#3a4fe0;--g:#0e9f6e;--w:#b7791f;--r:#d14343;--wb:#fff6e0}
@media(prefers-color-scheme:dark){:root{--bg:#0d1224;--c:#161d38;--t:#eef1fb;--m:#9aa5c6;--b:#28325a;--wb:#3a2f12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
nav{display:flex;gap:4px;align-items:center;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5;overflow-x:auto}
nav b{color:var(--p);font-size:18px;margin-right:12px;cursor:pointer;white-space:nowrap}nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
.n{background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--m)}.n.on{background:var(--p);color:#fff}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{background:var(--p);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}.btn.g{background:var(--g)}.btn.o{background:none;color:var(--p);border:1px solid var(--p)}.btn.s{padding:4px 10px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg)}label{font-size:12px;color:var(--m);display:block;margin:6px 0 2px}
.hero{background:linear-gradient(135deg,#3a4fe0,#0e9f6e);color:#fff;border-radius:18px;padding:40px 24px;text-align:center}.hero h1{font-size:clamp(28px,6vw,46px);margin:0}
.steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}.steps span{background:#ffffff26;padding:8px 14px;border-radius:99px;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e6ecff;color:var(--p)}.tag.G{background:#dcf5ea;color:#0a7a55}.tag.A{background:var(--wb);color:var(--w)}.tag.R{background:#fde3e3;color:var(--r)}
.warn{background:var(--wb);border-left:4px solid var(--w);padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.big{font-size:26px;font-weight:700}.m{color:var(--m);font-size:13px}
.bar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--b);margin:10px 0}.bar i{display:block}
.leg span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px}.leg s{width:10px;height:10px;border-radius:3px;display:inline-block}
.q{border-left:3px solid var(--p);padding-left:10px;margin:6px 0}
.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}.mod>div{background:var(--c);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
blockquote{margin:8px 0;padding:8px 12px;background:var(--bg);border-left:4px solid var(--g);border-radius:6px}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ch button{background:var(--c);border:1px solid var(--b);border-radius:99px;padding:6px 12px;cursor:pointer}.ch button.on{background:var(--p);color:#fff}
.pg{height:10px;background:var(--b);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);transition:width .4s}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top;font-size:13px}
ol.st{padding-left:20px}ol.st li{margin:4px 0}
</style></head><body><nav id="nav"></nav><main id="app"></main><div id="modal"></div>
<script>
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),M=(a,f)=>a.map(f).join(''),TN={cataract:'Cataract surgery',knee:'Knee replacement',appendix:'Appendix surgery',maternity:'Maternity',dialysis:'Dialysis'};
const KW={cataract:['cataract'],knee:['knee','joint'],appendix:['appendi'],maternity:['maternity'],dialysis:['dialysis']};
const RD={SumInsured:'Applies to all claims in the policy year.',Waiting:'Applies from the policy start date.',CoPay:'Applies to every admissible claim.',Deductible:'Applies per claim before the insurer pays.',Room:'Applies when the room rent exceeds the daily limit.',SubLimit:'Applies to the named treatment only.',Exclusion:'Applies to named treatments; no cover.',Claims:'Applies at claim submission.'};
const mk=(p,rows)=>rows.map((r,i)=>({id:p+(i+1),cat:r[0],pg:r[1],sec:r[2],q:r[3],rule:RD[r[0]]}));
const DEF={
A:{name:'SecureHealth Plus',si:500000,copay:10,ded:0,rent:5000,init:30,ped:36,w:{cataract:24,knee:24},sub:{cataract:40000},excl:['maternity'],gaps:['Ambulance limit not stated'],
docs:['Claim form','Discharge summary','Original bills','Investigation reports','ID proof (within 15 days of discharge)'],
cl:mk('A',[['SumInsured',4,'Schedule of Benefits','The Sum Insured is ₹5,00,000 per policy year on an individual basis.'],['Waiting',7,'Waiting Periods','An initial waiting period of 30 days applies to all claims except accidents.'],['Waiting',7,'Specified Disease Waiting','Cataract and knee joint replacement are covered only after 24 months of continuous cover.'],['Waiting',8,'Pre-existing Diseases','Pre-existing conditions are covered after 36 months of continuous coverage.'],['CoPay',9,'Co-payment','The insured shall bear 10% of every admissible claim.'],['Deductible',9,'Deductible','No deductible applies under this policy.'],['Room',10,'Room Rent Limit','Room rent is limited to 1% of Sum Insured per day (₹5,000). Proportionate deduction applies to other charges.'],['SubLimit',11,'Sub-limits','Cataract surgery is limited to ₹40,000 per eye.'],['Exclusion',14,'Permanent Exclusions','Maternity, infertility and cosmetic procedures are not covered.'],['Claims',18,'Claim Documents','Submit claim form, discharge summary, original bills, investigation reports and ID proof within 15 days of discharge.']])},
B:{name:'FamilyCare Essential',si:300000,copay:20,ded:10000,rent:3000,init:30,ped:48,w:{cataract:36,knee:36,maternity:24},sub:{cataract:25000,knee:150000,maternity:50000},excl:['dialysis'],gaps:['Pre-existing waiting wording is ambiguous','ICU room-rent limit not stated'],
docs:['Claim form','Discharge card','Hospital bills & receipts','Doctor prescription','KYC'],
cl:mk('B',[['SumInsured',3,'Policy Schedule','Sum Insured: ₹3,00,000 per family floater per year.'],['Waiting',6,'Initial Waiting','Claims within the first 30 days of the policy are not admissible, except accidents.'],['Waiting',6,'Specified Disease Waiting','Cataract and joint replacement are payable after 36 months of continuous cover.'],['Waiting',7,'Maternity Waiting','Maternity expenses are payable after 24 months of continuous cover.'],['Waiting',7,'Pre-existing Conditions','Pre-existing conditions are covered after 48 months, subject to continuous renewal as defined in Annexure 2.'],['CoPay',8,'Co-payment','A co-payment of 20% applies on all admissible claims.'],['Deductible',8,'Deductible','A deductible of ₹10,000 applies per claim.'],['Room',9,'Room Rent Limit','Room rent is limited to ₹3,000 per day; charges are reduced proportionately above this limit.'],['SubLimit',10,'Treatment Sub-limits','Cataract ₹25,000; knee replacement ₹1,50,000; maternity ₹50,000 per event.'],['Exclusion',12,'Exclusions','Dialysis for chronic renal failure and cosmetic procedures are excluded.'],['Claims',16,'Claim Requirements','Documents: claim form, discharge card, hospital bills and receipts, doctor prescription and KYC.']])}};
const DC={proc:{cataract:[45000,1],knee:[260000,4],appendix:[85000,3],maternity:[90000,3],dialysis:[36000,1]},city:{Pune:1,Mumbai:1.2,Nashik:.85,Nagpur:.9},hosp:{'Government':.35,'Mid-range private':1,'Premium private':1.7},room:{'General ward':1500,'Shared room':3500,'Single private room':6500}};
let DB;try{DB=JSON.parse(localStorage.cw)}catch(e){}if(!DB)DB=JSON.parse(JSON.stringify({pol:DEF,cost:DC}));
let SV=[];try{SV=JSON.parse(localStorage.cwsv)||[]}catch(e){}
const save=()=>{try{localStorage.cw=JSON.stringify(DB);localStorage.cwsv=JSON.stringify(SV)}catch(e){}};
const mAgo=n=>{const d=new Date();d.setMonth(d.getMonth()-n);return d.toISOString().slice(0,10)};
let S={pg:'home',pol:'A',up:null,ready:null,qa:[],modal:null,cmp:0},E={t:'cataract',city:'Pune',h:'Mid-range private',room:'Shared room',pol:'A',start:mAgo(30),ped:false};
const rateOf=o=>DB.cost.room[o.room]*DB.cost.hosp[o.h]*DB.cost.city[o.city];
function calc(o,mm=1){const p=DB.pol[o.pol],[pr,days]=DB.cost.proc[o.t],rate=rateOf(o),C=(pr*DB.cost.city[o.city]*DB.cost.hosp[o.h]+days*rate)*mm;
let el=C,y={waiting:0,copay:0,ded:0,rent:0,sub:0,excl:0,beyond:0},st=[`Estimated treatment cost: ${R(C)} (${TN[o.t]}, ${o.city}, ${o.h}, ${o.room}).`];
if(p.excl.includes(o.t)){y.excl=el;el=0;st.push(`Exclusion: ${TN[o.t]} is listed as excluded, so nothing is payable (${R(y.excl)} falls on you).`)}else st.push('Exclusion check: treatment is not in the seeded exclusion list.');
const dd=(Date.now()-new Date(o.start))/864e5,mo=dd/30.44,need=Math.max(o.ped?p.ped:0,p.w[o.t]||0);
if(el>0&&(mo<need||dd<p.init)){y.waiting=el;el=0;st.push(`Waiting period: ${mo.toFixed(1)} months elapsed but ${mo<need?need+' months':p.init+' days'} required; not yet payable.`)}else st.push(`Waiting period: satisfied (${mo.toFixed(1)} months elapsed, ${need} months required).`);
const sb=p.sub[o.t];if(sb&&el>sb){y.sub=el-sb;el=sb;st.push(`Sub-limit: capped at ${R(sb)} for this treatment.`)}else st.push(sb?`Sub-limit ${R(sb)} not exceeded.`:'No treatment sub-limit found in seeded clauses.');
if(el>0&&rate>p.rent){const f=p.rent/rate;y.rent=el*(1-f);el*=f;st.push(`Room rent: ${R(rate)}/day exceeds limit ${R(p.rent)}/day, so the eligible amount is reduced proportionately (×${f.toFixed(2)}).`)}else st.push(`Room rent: ${R(rate)}/day is within the ${R(p.rent)}/day limit, or nothing is payable.`);
y.ded=Math.min(p.ded,el);el-=y.ded;st.push(p.ded?`Deductible: ${R(y.ded)} borne by you first.`:'Deductible: none.');
y.copay=el*p.copay/100;el-=y.copay;st.push(`Co-pay: ${p.copay}% = ${R(y.copay)} borne by you.`);
if(el>p.si){y.beyond=el-p.si;el=p.si;st.push(`Sum insured: capped at ${R(p.si)}.`)}else st.push(`Sum insured ${R(p.si)} is not exceeded.`);
let conf=(o.ped&&o.pol=='B')?'Low':(o.ped||y.rent>0||sb||Math.abs(mo-need)<3)?'Medium':'High';if((y.excl||y.waiting)&&conf=='High')conf='Medium';
st.push(`Insurer contribution ≈ ${R(el)}; your estimated out-of-pocket ≈ ${R(C-el)}.`);return{C,ins:el,oop:C-el,y,st,conf,mo,need,p,o}}
const cl=(p,cat,kws)=>DB.pol[p].cl.filter(c=>c.cat==cat&&(!kws||kws.some(k=>c.q.toLowerCase().includes(k))));
function ask(q){const p=S.pol,P=DB.pol[p],x=q.toLowerCase();let a,ev=[],conf='High',chg='',warn='';
const t=Object.keys(TN).find(k=>KW[k].some(w=>x.includes(w)));
if(t){const ex=P.excl.includes(t),w=P.w[t],sb=P.sub[t],k=KW[t];ev=[...cl(p,'Exclusion',k),...(w?cl(p,'Waiting',k):cl(p,'Waiting',['initial'])),...(sb?cl(p,'SubLimit',k):[])].map(c=>c.id);
if(!ev.length)ev=cl(p,'Exclusion').map(c=>c.id);
a=ex?`No. ${TN[t]} appears in the policy exclusions, so it is not expected to be covered.`:`Likely yes, subject to conditions: ${w?`a ${w}-month waiting period`:'only the 30-day initial waiting period'}${sb?`, a treatment sub-limit of ${R(sb)}`:''}, plus ${P.copay}% co-pay${P.ded?` and a ${R(P.ded)} deductible`:''}. Claim approval is never guaranteed.`;
if(!w&&!sb&&!ex){conf='Medium';warn='No treatment-specific clause was found in the seeded clauses; this answer relies on general terms.'}chg='Pre-existing conditions, actual hospital bills, room category, and whether your policy start date meets the waiting period.'}
else if(/wait/.test(x)){a=`Initial wait: ${P.init} days. Specific treatments: ${Object.entries(P.w).map(([k,v])=>TN[k]+' '+v+' months').join(', ')}. Pre-existing conditions: ${P.ped} months.`;ev=cl(p,'Waiting').map(c=>c.id);chg='Continuous renewal without a break, and whether the condition is pre-existing.'}
else if(/room|private/.test(x)){a=`Room rent is limited to ${R(P.rent)} per day. A single private room at typical private-hospital rates may exceed this, which reduces the payable amount proportionately.`;ev=cl(p,'Room').map(c=>c.id);conf='Medium';chg='Hospital room tariff, ICU rules and city.'}
else if(/document|claim/.test(x)){a='Documents listed: '+P.docs.join(', ')+'.';ev=cl(p,'Claims').map(c=>c.id);chg='The insurer or TPA may request additional papers.'}
else if(/exclu/.test(x)){a=`Excluded: ${P.excl.map(k=>TN[k]).join(', ')}, and cosmetic procedures. Check the original policy for the full list.`;ev=cl(p,'Exclusion').map(c=>c.id);conf='Medium';chg='Exclusions may carry extra conditions in annexures not seeded here.'}
else if(/co-?pay/.test(x)){a=`Co-pay is ${P.copay}% of each admissible claim.`;ev=cl(p,'CoPay').map(c=>c.id)}
else if(/deduct/.test(x)){a=P.ded?`Deductible is ${R(P.ded)} per claim.`:'No deductible applies.';ev=cl(p,'Deductible').map(c=>c.id)}
else if(/sum insured|amount/.test(x)){a=`Sum insured is ${R(P.si)} per year.`;ev=cl(p,'SumInsured').map(c=>c.id)}
else{const ws=x.split(/\W+/).filter(w=>w.length>4);const h=P.cl.filter(c=>ws.some(w=>(c.q+c.sec).toLowerCase().includes(w)));if(h.length){a='These are the closest matching clauses; I cannot give a definite answer from them.';ev=h.slice(0,3).map(c=>c.id);conf='Low'}else{a='I could not find this in the seeded policy clauses, so I will not guess. Please check the original policy or ask the insurer.';conf='Low';warn='Unsupported question.'}chg='Any clause not captured in the seeded data.'}
if(P.gaps.length&&conf!='Low'&&/wait|pre-exist/.test(x))warn=P.gaps.join('; ');
S.qa.push({q,a,ev,conf,chg,warn,pol:P.name});render()}
const ev=ids=>{S.modal=ids;render()};
const cc=c=>c=='High'?'G':c=='Medium'?'A':'R';
const evBlock=ids=>M(ids,id=>{const c=DB.pol[id[0]].cl.find(z=>z.id==id);return c?`<blockquote><b>${c.sec}</b> · Page ${c.pg} · <span class=tag>${c.cat}</span><br>“${c.q}”<div class=m>Applies when: ${c.rule}</div></blockquote>`:''})||'<div class=warn>No supporting clause found.</div>';
const F=(l,k,opts)=>`<div><label>${l}</label><select onchange="E['${k}']=this.value;render()">${M(opts,o=>{const[v,n]=Array.isArray(o)?o:[o,o];return`<option ${E[k]==v?'selected':''} value="${v}">${n}</option>`})}</select></div>`;
const form=()=>`<div class=grid>${F('Treatment','t',Object.entries(TN))}${F('City','city',Object.keys(DB.cost.city))}${F('Hospital type','h',Object.keys(DB.cost.hosp))}${F('Room type','room',Object.keys(DB.cost.room))}${F('Policy','pol',Object.entries(DB.pol).map(([k,v])=>[k,v.name]))}<div><label>Policy start date</label><input type=date value="${E.start}" onchange="E.start=this.value;render()"></div><div><label>Pre-existing condition</label><label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--t)"><input type=checkbox style="width:auto" ${E.ped?'checked':''} onchange="E.ped=this.checked;render()"> Applies to this treatment</label></div></div>`;
const COL={ins:'#0e9f6e',copay:'#3a4fe0',ded:'#6b7bf0',rent:'#e0a020',sub:'#f0c060',waiting:'#d14343',excl:'#a02a2a',beyond:'#777'},LB={ins:'Insurer pays',copay:'Co-pay',ded:'Deductible',rent:'Room-rent limit',sub:'Sub-limit',waiting:'Waiting period',excl:'Exclusion',beyond:'Beyond sum insured'};
function result(r,title){const parts=Object.entries({ins:r.ins,...r.y}).filter(e=>e[1]>0.5);return`<div class=card>${title?`<h3 style="margin:0 0 8px">${title}</h3>`:''}<div class=grid><div><div class=m>Estimated cost (range ${R(calc(r.o,.8).C)}–${R(calc(r.o,1.3).C)})</div><div class=big>${R(r.C)}</div></div><div><div class=m>Sum insured</div><div class=big>${R(r.p.si)}</div></div><div><div class=m>Potentially covered</div><div class=big style="color:var(--g)">${R(r.ins)}</div></div><div><div class=m>Your out-of-pocket</div><div class=big style="color:var(--p)">${R(r.oop)}</div></div></div>
<div class=bar>${M(parts,([k,v])=>`<i title="${LB[k]}" style="width:${v/r.C*100}%;background:${COL[k]}"></i>`)}</div><div class=leg>${M(parts,([k,v])=>`<span><s style="background:${COL[k]}"></s>${LB[k]} ${R(v)}</span>`)}</div>
<p>Confidence: <span class="tag ${cc(r.conf)}">${r.conf}</span></p></div>`}
const why=r=>`<div class=card><h3 style="margin-top:0">Why you may pay</h3><table>${M(Object.entries(r.y),([k,v])=>`<tr><td>${LB[k]}</td><td>${R(v)}</td></tr>`)}</table><h4>Calculation steps</h4><ol class=st>${M(r.st,s=>`<li>${s}</li>`)}</ol></div>`;
const disc='<div class=warn><b>This is an estimate, not a claim decision.</b> Illustrative only, based on synthetic cost data. Not medical, legal or insurance advice. Claim approval is never guaranteed.</div>';
function summary(p){const P=DB.pol[p],f=c=>(P.cl.find(z=>z.cat==c)||{}).id;const it=[['Sum insured',R(P.si),f('SumInsured')],['Waiting periods',`Initial ${P.init}d · specific up to ${Math.max(...Object.values(P.w))}m · PED ${P.ped}m`,f('Waiting')],['Co-pay',P.copay+'%',f('CoPay')],['Deductible',P.ded?R(P.ded):'None',f('Deductible')],['Room-rent limit',R(P.rent)+'/day',f('Room')],['Key exclusions',P.excl.map(k=>TN[k]).join(', ')+', cosmetic',f('Exclusion')],['Sub-limits',Object.entries(P.sub).map(([k,v])=>TN[k]+' '+R(v)).join(', '),f('SubLimit')],['Claim documents',P.docs.length+' documents',f('Claims')]];
return`<div class=grid>${M(it,i=>`<div class=card style="margin:0"><div class=m>${i[0]}</div><b>${i[1]}</b><div><button class="btn o s" onclick="ev(['${i[2]}'])">View evidence</button></div></div>`)}</div>${P.gaps.length?`<div class=warn><b>Missing / ambiguous:</b> ${P.gaps.join('; ')}</div>`:''}`}
const readiness=p=>Math.max(0,100-DB.pol[p].gaps.length*15);
function snap(){const r=calc(E);SV.unshift({id:Date.now(),name:`${TN[E.t]} · ${DB.pol[E.pol].name}`,e:{...E},ins:r.ins,oop:r.oop,at:new Date().toLocaleDateString()});save();alert('Saved to dashboard')}
function ups(f){S.up={n:f.name,p:0};const iv=setInterval(()=>{S.up.p+=20;if(S.up.p>=100){clearInterval(iv);S.ready=S.pol}render()},500);render()}
const stg=['Uploading to storage','Reading pages','Detecting clauses','Structuring policy data','Done'];
function cmpSet(){const m=S.cmp,b=E,O=[[{room:'Shared room'},{room:'Single private room'}],[{start:mAgo(6)},{start:mAgo(48)}],[{h:'Mid-range private'},{h:'Premium private'}],[{pol:'A'},{pol:'B'}]][m],
N=[['Shared room','Single private room'],['Start 6 months ago','Start 48 months ago'],['Mid-range private','Premium private'],[DB.pol.A.name,DB.pol.B.name]][m];return[N,calc({...b,...O[0]}),calc({...b,...O[1]})]}
const pages={
home:()=>`<div class=hero><h1>CoverWise</h1><p style="font-size:20px">Understand your health cover before you need it.</p><div class=steps><span>1 Upload Policy</span>→<span>2 Ask a Question</span>→<span>3 Estimate Treatment Cost</span>→<span>4 Understand Your Share</span></div><button class="btn" style="background:#fff;color:var(--p)" onclick="S.ready='A';S.pol='A';go('qa')">Try demo policy</button> <button class="btn g" onclick="go('upload')">Analyse my policy</button></div><div class=grid style="margin-top:16px"><div class=card><b>Cited answers</b><br>Every answer shows page, section and the quoted clause.</div><div class=card><b>Live estimates</b><br>Change room or date and watch insurer vs your share update.</div><div class=card><b>Honest about gaps</b><br>Missing or ambiguous wording is flagged, never guessed.</div></div>${disc}`,
upload:()=>`<h2>Policy upload &amp; processing</h2><div class=card><b>Upload your policy PDF</b><input type=file accept=".pdf" onchange="this.files[0]&&ups(this.files[0])"><p class=m>Prototype: the file is not sent anywhere yet (Supabase Storage comes in the backend phase). Extraction uses the seeded clauses of the selected demo policy.</p>${S.up?`<div class=pg><i style="width:${S.up.p}%"></i></div><p class=m>${S.up.n} — ${stg[Math.min(4,Math.floor(S.up.p/25))]}…</p>`:''}</div><div class=grid>${M(Object.entries(DB.pol),([k,v])=>`<div class=card style="margin:0;${S.pol==k?'border-color:var(--p)':''}"><b>${v.name}</b><div class=m>Sum insured ${R(v.si)} · ${v.cl.length} clauses</div><button class="btn s" onclick="S.pol='${k}';S.ready='${k}';S.up=null;render()">Use demo policy</button></div>`)}</div>${S.ready?`<h3>Extracted summary — ${DB.pol[S.ready].name}</h3>${summary(S.ready)}<p><button class=btn onclick="go('qa')">Ask a question</button> <button class="btn o" onclick="E.pol=S.ready;go('est')">Estimate cost</button></p>`:''}`,
qa:()=>`<h2>Policy Q&amp;A — ${DB.pol[S.pol].name}</h2><select onchange="S.pol=this.value;S.qa=[];render()" style="max-width:280px">${M(Object.entries(DB.pol),([k,v])=>`<option value=${k} ${S.pol==k?'selected':''}>${v.name}</option>`)}</select><div class=ch>${M(['Is cataract surgery covered?','What is my waiting period?','Does this policy cover a private room?','What documents are required for a claim?','What exclusions should I know about?'],q=>`<button onclick="ask(this.textContent)">${q}</button>`)}</div>
<div style="display:flex;gap:8px"><input id=qi placeholder="Ask about your policy…" onkeydown="if(event.key=='Enter'&&this.value)ask(this.value)"><button class=btn onclick="qi.value&&ask(qi.value)">Ask</button></div><div style="margin-top:14px">${M(S.qa.slice().reverse(),x=>`<div class=card><div class=q><b>${x.q}</b> <span class=m>(${x.pol})</span></div><p>${x.a}</p><span class="tag ${cc(x.conf)}">Confidence: ${x.conf}</span>${x.warn?`<div class=warn>⚠ ${x.warn}</div>`:''}<h4 style="margin:10px 0 0">Policy evidence</h4>${evBlock(x.ev)}<div class=warn style="background:none;border-color:var(--p)"><b>What could change this answer?</b> ${x.chg}</div></div>`)}</div>${disc}`,
est:()=>{const r=calc(E);return`<h2>Treatment cost estimator</h2><div class=card>${form()}</div>${disc}${result(r)}${why(r)}<button class="btn g" onclick="snap()">Save analysis</button> <button class="btn o" onclick="go('cmp')">Compare what-ifs</button>`},
cmp:()=>{const[n,a,b]=cmpSet(),dd=b.oop-a.oop;return`<h2>What-if comparison</h2><div class=ch>${M(['Shared vs private room','Before vs after waiting period','Mid-range vs premium hospital','Policy A vs Policy B'],(l,i)=>`<button class="${S.cmp==i?'on':''}" onclick="S.cmp=${i};render()">${l}</button>`)}</div><div class=card>${form()}<p class=m>The compared field is overridden on each side; everything else comes from this form.</p></div>${disc}<div class=grid><div>${result(a,'A · '+n[0])}</div><div>${result(b,'B · '+n[1])}</div></div><div class=card><b>What changed:</b> your out-of-pocket moves from ${R(a.oop)} to ${R(b.oop)} (${dd>=0?'+':'−'}${R(Math.abs(dd))}); the insurer contribution moves from ${R(a.ins)} to ${R(b.ins)}.<ol class=st><li>A: ${a.st.filter(s=>/^(Waiting|Exclusion)/.test(s)).join(' ')}</li><li>B: ${b.st.filter(s=>/^(Waiting|Exclusion)/.test(s)).join(' ')}</li><li>Room rent A: ${a.st.find(s=>s.startsWith('Room'))}</li><li>Room rent B: ${b.st.find(s=>s.startsWith('Room'))}</li></ol></div>`},
saved:()=>`<h2>Saved analyses</h2><div class=grid>${M(Object.entries(DB.pol),([k,v])=>`<div class=card><b>${v.name}</b><div class=m>Policy readiness (completeness of policy details)</div><div class=big>${readiness(k)}%</div><div class=pg><i style="width:${readiness(k)}%"></i></div>${M(v.gaps,g=>`<div class=m>• ${g}</div>`)}</div>`)}</div>${SV.length?M(SV,s=>`<div class=card><b>${s.name}</b> <span class=m>${s.at}</span><div class=m>${s.e.city} · ${s.e.h} · ${s.e.room}</div><div>Insurer ≈ ${R(s.ins)} · You ≈ ${R(s.oop)}</div><button class="btn s" onclick="E={...SV.find(z=>z.id==${s.id}).e};go('est')">Open</button> <button class="btn o s" onclick="const n=prompt('Rename',SV.find(z=>z.id==${s.id}).name);if(n){SV.find(z=>z.id==${s.id}).name=n;save();render()}">Rename</button> <button class="btn o s" style="color:var(--r);border-color:var(--r)" onclick="SV=SV.filter(z=>z.id!=${s.id});save();render()">Delete</button></div>`):'<div class=card>No saved analyses yet. Save one from the estimator.</div>'}${disc}`,
admin:()=>{const P=DB.pol[S.pol];return`<h2>Admin / demo data <span class="tag A">Prototype only</span></h2><select onchange="S.pol=this.value;render()" style="max-width:280px">${M(Object.entries(DB.pol),([k,v])=>`<option value=${k} ${S.pol==k?'selected':''}>${v.name}</option>`)}</select><div class=card style="overflow:auto"><h3 style="margin-top:0">Policy clauses</h3><table><tr><th>Category</th><th>Page</th><th>Section</th><th>Quote</th><th>Applicability</th></tr>${M(P.cl,(c,i)=>`<tr><td><select onchange="ed(${i},'cat',this.value)">${M(Object.keys(RD),k=>`<option ${k==c.cat?'selected':''}>${k}</option>`)}</select></td><td><input type=number style="width:64px" value=${c.pg} onchange="ed(${i},'pg',+this.value)"></td><td><input value="${c.sec}" onchange="ed(${i},'sec',this.value)"></td><td><textarea rows=3 onchange="ed(${i},'q',this.value)">${c.q}</textarea></td><td><textarea rows=3 onchange="ed(${i},'rule',this.value)">${c.rule}</textarea></td></tr>`)}</table></div><div class=card style="overflow:auto"><h3 style="margin-top:0">Synthetic cost data (typical: Pune, mid-range private)</h3><table><tr><th>Treatment</th><th>Procedure ₹</th><th>Stay days</th></tr>${M(Object.entries(DB.cost.proc),([k,v])=>`<tr><td>${TN[k]}</td><td><input type=number value=${v[0]} onchange="DB.cost.proc['${k}'][0]=+this.value;save()"></td><td><input type=number value=${v[1]} onchange="DB.cost.proc['${k}'][1]=+this.value;save()"></td></tr>`)}</table><p class=m>City multipliers: ${M(Object.entries(DB.cost.city),([k,v])=>`${k} ×<input type=number step=.05 style="width:70px;display:inline" value=${v} onchange="DB.cost.city['${k}']=+this.value;save()"> `)}</p><button class="btn o s" onclick="localStorage.clear();location.reload()">Reset seed data</button></div>`}};
function ed(i,k,v){DB.pol[S.pol].cl[i][k]=v;save()}
const NAV=[['home','Home'],['upload','Policy'],['qa','Q&A'],['est','Estimator'],['cmp','What-if'],['saved','Saved'],['admin','Admin']];
function go(p){S.pg=p;render();scrollTo(0,0)}
function render(){nav.innerHTML='<b onclick="go(\'home\')">🛡 CoverWise</b>'+M(NAV,n=>`<button class="n ${S.pg==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`);const y=scrollY;app.innerHTML=pages[S.pg]();modal.innerHTML=S.modal?`<div class=mod onclick="S.modal=null;render()"><div onclick="event.stopPropagation()"><h3 style="margin-top:0">Policy evidence</h3>${evBlock(S.modal)}<button class=btn onclick="S.modal=null;render()">Close</button></div></div>`:'';scrollTo(0,y)}
render();
</script></body></html>
